<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werba Way · ćwiczenia</title>
<style>
:root{--bg:#F6F1E7;--paper:#FFFDF8;--ink:#1f2a37;--soft:#6b7280;--line:#e7dfcf;--ok:#1f8a5b;--okbg:#e3f4ea;--no:#c0392b;--nobg:#fbe5e1;--acc:#F7D774;--chip:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px;box-shadow:0 2px 0 rgba(0,0,0,.04)}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:0}
h1{font-size:22px;margin:4px 0 6px}
.uk{color:var(--soft);font-size:14px;margin:2px 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:#e8c14d;font-weight:600}
.item{border-top:1px dashed var(--line);padding:12px 0}
.item:first-child{border-top:0}
.q{margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
.chip.sel{border-color:#c9a227;background:#fff6d6}
.chip.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.chip.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.chip:disabled{opacity:.55;cursor:default}
input.blank{font:inherit;border:0;border-bottom:2px dashed #9ca3af;background:#fff;padding:6px 6px;min-width:180px}
input.blank.ok{border-color:var(--ok);background:var(--okbg)}
input.blank.no{border-color:var(--no);background:var(--nobg)}
.btn{border:0;background:#1f2a37;color:#fff;border-radius:10px;padding:7px 14px;font:inherit;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.fb{font-size:14px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.sb-out{min-height:44px;border:2px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;background:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.match .chip{text-align:left}
.score{margin:14px 0 6px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:10px}
.vc{perspective:900px;height:170px;cursor:pointer}
.vc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.vc.flip .in{transform:rotateY(180deg)}
.vc .f,.vc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;justify-content:center}
.vc .f{background:#fff;text-align:center;font-weight:700;font-size:18px}
.vc .f small{display:block;font-weight:400;font-size:12px;color:var(--soft);margin-top:6px}
.vc .b{background:#fffaf0;transform:rotateY(180deg);font-size:14px;gap:4px}
.vc .b .tr{font-weight:700}
.vc .b .ex{font-style:italic;color:#374151}
.g0{border-top:4px solid #f0a35e}.g1{border-top:4px solid #5b9bd5}.g2{border-top:4px solid #5cb85c}.g3{border-top:4px solid #9b6fd0}.g4{border-top:4px solid #e07ab0}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:10px}
.ft{border-radius:12px;border:1px solid var(--line);padding:14px;cursor:pointer;min-height:110px}
.ft h3{margin:0 0 6px;font-size:17px}
.ft .hint{font-size:13px;color:var(--soft);font-style:italic}
.ftc0{background:#fff1b8}.ftc1{background:#d8efe3}.ftc2{background:#dcebf9}.ftc3{background:#f9ddd3}
.ftback{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.ftback ul{margin:6px 0 0 18px;padding:0}
.dlg p{margin:4px 0}
.filter{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.filter button.on{background:#1f2a37;color:#fff}
@media (max-width:560px){.match{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"></div></div>
<script>
const DATA = {"vocab": {"lesson_id": "pl-kpk1-r01-powtorka", "exercise_type": "vocab-cards", "title": "Słownictwo: lekcje 1–3 w jednym miejscu", "instruction": "40 słów i zwrotów w pięciu grupach. Odwróć kartę, przeczytaj i powiedz własne zdanie.", "estimated_minutes": 5, "groups": ["Powitania i pożegnania", "Na lekcji", "O sobie", "Rzeczy", "Jaki? Jaka? Jakie?"], "comm_groups": ["Powitania i pożegnania", "Na lekcji", "O sobie", "Rzeczy"], "items": [{"id": "v01", "term": "Dzień dobry!", "group": "Powitania i pożegnania", "part_of_speech": "zwrot", "definition": "Oficjalne powitanie: do pani, do pana, w sekretariacie.", "example": "Dzień dobry! Jak się pani nazywa?", "translation_uk": "добрий день (офіційно)"}, {"id": "v02", "term": "Cześć!", "group": "Powitania i pożegnania", "part_of_speech": "zwrot", "definition": "Nieoficjalne powitanie i pożegnanie: do kolegi, do koleżanki.", "example": "Cześć, Piotr! Do jutra!", "translation_uk": "привіт / бувай (неофіційно)"}, {"id": "v03", "term": "Do widzenia!", "group": "Powitania i pożegnania", "part_of_speech": "zwrot", "definition": "Oficjalne pożegnanie.", "example": "Dziękuję bardzo. Do widzenia!", "translation_uk": "до побачення"}, {"id": "v04", "term": "Do jutra!", "group": "Powitania i pożegnania", "part_of_speech": "zwrot", "definition": "Pożegnanie, kiedy widzimy się jutro.", "example": "Cześć, Ola, do jutra!", "translation_uk": "до завтра"}, {"id": "v05", "term": "Bardzo mi miło. / Miło mi.", "group": "Powitania i pożegnania", "part_of_speech": "zwrot", "definition": "Mówimy, kiedy poznajemy nową osobę.", "example": "Jestem Kasia. — Miło mi, Piotr.", "translation_uk": "дуже приємно / приємно"}, {"id": "v06", "term": "Mnie również.", "group": "Powitania i pożegnania", "part_of_speech": "zwrot", "definition": "Odpowiedź na „Miło mi”.", "example": "Bardzo mi miło. — Mnie również!", "translation_uk": "мені також"}, {"id": "v07", "term": "Co słychać?", "group": "Powitania i pożegnania", "part_of_speech": "zwrot", "definition": "Pytanie: jak się masz, co nowego.", "example": "Cześć, Marta! Co słychać?", "translation_uk": "як справи? що чути?"}, {"id": "v08", "term": "Wszystko w porządku.", "group": "Powitania i pożegnania", "part_of_speech": "zwrot", "definition": "Odpowiedź: wszystko jest OK.", "example": "Dziękuję, wszystko w porządku, a u ciebie?", "translation_uk": "все гаразд"}, {"id": "v09", "term": "Nie rozumiem.", "group": "Na lekcji", "part_of_speech": "zwrot", "definition": "Mówisz, kiedy nie wiesz, co ktoś powiedział.", "example": "Przepraszam, nie rozumiem.", "translation_uk": "я не розумію"}, {"id": "v10", "term": "Proszę powtórzyć.", "group": "Na lekcji", "part_of_speech": "zwrot", "definition": "Prośba: proszę powiedzieć jeszcze raz.", "example": "Nie rozumiem. Proszę powtórzyć.", "translation_uk": "повторіть, будь ласка"}, {"id": "v11", "term": "Proszę przeliterować.", "group": "Na lekcji", "part_of_speech": "zwrot", "definition": "Prośba: proszę powiedzieć litery: A-N-N-A.", "example": "Proszę przeliterować nazwisko.", "translation_uk": "продиктуйте по літерах"}, {"id": "v12", "term": "Co to znaczy…?", "group": "Na lekcji", "part_of_speech": "zwrot", "definition": "Pytanie o słowo, którego nie rozumiesz.", "example": "Co to znaczy „tablica”?", "translation_uk": "що означає…?"}, {"id": "v13", "term": "Jak się mówi po polsku…?", "group": "Na lekcji", "part_of_speech": "zwrot", "definition": "Pytanie o polskie słowo.", "example": "Jak się mówi po polsku „ручка”?", "translation_uk": "як сказати польською…?"}, {"id": "v14", "term": "Nie wiem. / Nie pamiętam.", "group": "Na lekcji", "part_of_speech": "zwrot", "definition": "Mówisz, kiedy nie masz odpowiedzi.", "example": "Przepraszam, nie pamiętam, jak masz na imię.", "translation_uk": "не знаю / не пам'ятаю"}, {"id": "v15", "term": "Mam pytanie.", "group": "Na lekcji", "part_of_speech": "zwrot", "definition": "Mówisz przed pytaniem.", "example": "Przepraszam, mam pytanie.", "translation_uk": "у мене питання"}, {"id": "v16", "term": "Gdzie jest…? — tu / tam", "group": "Na lekcji", "part_of_speech": "zwrot", "definition": "Pytanie o miejsce. Na prawo, na lewo, tu, tam.", "example": "Gdzie jest toaleta? — Tam, na prawo.", "translation_uk": "де…? — тут / там"}, {"id": "v17", "term": "imię", "group": "O sobie", "part_of_speech": "rzeczownik, n.", "definition": "Na przykład: Anna, Piotr, Olena.", "example": "Moje imię to Olena.", "translation_uk": "ім'я"}, {"id": "v18", "term": "nazwisko", "group": "O sobie", "part_of_speech": "rzeczownik, n.", "definition": "Na przykład: Kowalski, Nowak, Bondar.", "example": "Proszę przeliterować nazwisko.", "translation_uk": "прізвище"}, {"id": "v19", "term": "adres", "group": "O sobie", "part_of_speech": "rzeczownik, m.", "definition": "Ulica, numer domu, miasto.", "example": "Mój adres: ulica Długa 12, Kraków.", "translation_uk": "адреса"}, {"id": "v20", "term": "numer telefonu", "group": "O sobie", "part_of_speech": "rzeczownik, m.", "definition": "Cyfry, na przykład 12 21 07 19.", "example": "Masz telefon? Jaki jest twój numer?", "translation_uk": "номер телефону"}, {"id": "v21", "term": "być z… (skąd?)", "group": "O sobie", "part_of_speech": "czasownik", "definition": "Mówimy, jaki jest nasz kraj.", "example": "Jestem z Ukrainy, a ty?", "translation_uk": "бути з… (звідки?)"}, {"id": "v22", "term": "mieszkać (gdzie?)", "group": "O sobie", "part_of_speech": "czasownik", "definition": "Mieć dom albo mieszkanie w mieście.", "example": "Mieszkam w Krakowie.", "translation_uk": "жити, мешкати (де?)"}, {"id": "v23", "term": "uczyć się polskiego", "group": "O sobie", "part_of_speech": "czasownik", "definition": "Mieć lekcje języka polskiego.", "example": "Uczę się polskiego, bo to moje hobby.", "translation_uk": "вчити польську"}, {"id": "v24", "term": "pracować / studiować", "group": "O sobie", "part_of_speech": "czasownik", "definition": "Mieć pracę / mieć zajęcia na uniwersytecie.", "example": "Uczę się polskiego, żeby pracować w Polsce.", "translation_uk": "працювати / навчатися (в університеті)"}, {"id": "v25", "term": "grać w… / na…", "group": "O sobie", "part_of_speech": "czasownik", "definition": "grać w tenisa; grać na gitarze.", "example": "Gram w tenisa, ale nie gram na gitarze.", "translation_uk": "грати в… / на…"}, {"id": "v26", "term": "długopis (ten)", "group": "Rzeczy", "part_of_speech": "rzeczownik, m.", "definition": "Rzecz do pisania. Uwaga: to rodzaj męski!", "example": "Ten długopis jest czarny.", "translation_uk": "ручка ⚠️"}, {"id": "v27", "term": "ołówek (ten)", "group": "Rzeczy", "part_of_speech": "rzeczownik, m.", "definition": "Rzecz do pisania, często z gumką.", "example": "Mam ołówek z gumką.", "translation_uk": "олівець"}, {"id": "v28", "term": "zeszyt (ten)", "group": "Rzeczy", "part_of_speech": "rzeczownik, m.", "definition": "Na lekcji piszemy w nim ćwiczenia.", "example": "Ten zeszyt jest nowy.", "translation_uk": "зошит"}, {"id": "v29", "term": "książka (ta)", "group": "Rzeczy", "part_of_speech": "rzeczownik, f.", "definition": "Czytamy ją, na przykład podręcznik.", "example": "Ta książka jest bardzo dobra.", "translation_uk": "книжка"}, {"id": "v30", "term": "krzesło (to)", "group": "Rzeczy", "part_of_speech": "rzeczownik, n.", "definition": "Siedzimy na nim. Uwaga: to rodzaj nijaki!", "example": "To krzesło jest stare.", "translation_uk": "стілець ⚠️"}, {"id": "v31", "term": "kubek (ten)", "group": "Rzeczy", "part_of_speech": "rzeczownik, m.", "definition": "Pijemy z niego kawę albo herbatę.", "example": "Ten kubek jest biały.", "translation_uk": "чашка, горнятко ⚠️"}, {"id": "v32", "term": "komórka (ta)", "group": "Rzeczy", "part_of_speech": "rzeczownik, f.", "definition": "Telefon, który masz w torbie.", "example": "Ta komórka jest nowa.", "translation_uk": "мобільний телефон"}, {"id": "v33", "term": "klucz (ten)", "group": "Rzeczy", "part_of_speech": "rzeczownik, m.", "definition": "Otwiera drzwi do domu.", "example": "To jest klucz, a to paszport.", "translation_uk": "ключ"}, {"id": "v34", "term": "nowy ↔ stary", "group": "Jaki? Jaka? Jakie?", "part_of_speech": "przymiotnik", "definition": "nowy: kupiony teraz; stary: ma dużo lat.", "example": "Mój słownik jest stary, ale dobry.", "translation_uk": "новий ↔ старий"}, {"id": "v35", "term": "dobry ↔ zły", "group": "Jaki? Jaka? Jakie?", "part_of_speech": "przymiotnik", "definition": "zły: nie jest dobry.", "example": "Ten słownik jest zły, bo jest za mały.", "translation_uk": "добрий, хороший ↔ поганий"}, {"id": "v36", "term": "duży ↔ mały", "group": "Jaki? Jaka? Jakie?", "part_of_speech": "przymiotnik", "definition": "duży jak stół, mały jak klucz.", "example": "Ta torba jest duża.", "translation_uk": "великий ↔ малий"}, {"id": "v37", "term": "fajny / modny", "group": "Jaki? Jaka? Jakie?", "part_of_speech": "przymiotnik", "definition": "fajny: super, OK; modny: teraz w modzie.", "example": "Fajna torba! Bardzo modna.", "translation_uk": "класний / модний"}, {"id": "v38", "term": "czerwony / niebieski", "group": "Jaki? Jaka? Jakie?", "part_of_speech": "przymiotnik, kolor", "definition": "Dwa kolory: czerwony jak wino, niebieski jak niebo.", "example": "Ta mapa jest czerwona i niebieska.", "translation_uk": "червоний / синій, блакитний"}, {"id": "v39", "term": "zielony / żółty", "group": "Jaki? Jaka? Jakie?", "part_of_speech": "przymiotnik, kolor", "definition": "zielona herbata, żółty ser.", "example": "Ten ołówek jest zielony.", "translation_uk": "зелений / жовтий"}, {"id": "v40", "term": "czarny / biały", "group": "Jaki? Jaka? Jakie?", "part_of_speech": "przymiotnik, kolor", "definition": "Czarny jak noc, biały jak mleko.", "example": "Czarny kubek, biała tablica.", "translation_uk": "чорний / білий"}]}, "grammar": {"lesson_id": "pl-kpk1-r01-powtorka", "exercise_type": "fill-in-blank", "title": "Powtórka: lekcje 1–3", "instruction": "Krótkie bloki. Najpierw próbujesz sam / sama, ściąga jest na stronie lekcji.", "eyebrow": "powtórka", "estimated_minutes": 20, "blocks": [{"block_id": "g1", "exercise_type": "fill-in-blank", "title": "1. Być: jestem, jesteś, jest…", "instruction": "Co pasuje? Wybierz formę.", "part": 1, "items": [{"id": "g1-1", "text": "Przepraszam, gdzie ___ toaleta?", "options": ["jestem", "jesteś", "jest", "jesteśmy", "jesteście", "są"], "answer": "jest", "grammar_point": "byc"}, {"id": "g1-2", "text": "(Ja) ___ z Ukrainy, a ty?", "options": ["jestem", "jesteś", "jest", "jesteśmy", "jesteście", "są"], "answer": "jestem", "grammar_point": "byc"}, {"id": "g1-3", "text": "Skąd ___, Kasia?", "options": ["jestem", "jesteś", "jest", "jesteśmy", "jesteście", "są"], "answer": "jesteś", "grammar_point": "byc"}, {"id": "g1-4", "text": "Pan Nowak i pani Nowak ___ w domu.", "options": ["jestem", "jesteś", "jest", "jesteśmy", "jesteście", "są"], "answer": "są", "grammar_point": "byc"}, {"id": "g1-5", "text": "My ___ w szkole, a wy?", "options": ["jestem", "jesteś", "jest", "jesteśmy", "jesteście", "są"], "answer": "jesteśmy", "grammar_point": "byc"}, {"id": "g1-6", "text": "Wy też ___ z Polski?", "options": ["jestem", "jesteś", "jest", "jesteśmy", "jesteście", "są"], "answer": "jesteście", "grammar_point": "byc"}, {"id": "g1-7", "text": "Skąd pani ___?", "options": ["jestem", "jesteś", "jest", "jesteśmy", "jesteście", "są"], "answer": "jest", "grammar_point": "pan-pani", "explanation": "Pani = ona, pan = on → jest. Ukraińskie «ви» do jednej osoby to po polsku pan / pani."}, {"id": "g1-8", "text": "Skąd ___ państwo?", "options": ["jestem", "jesteś", "jest", "jesteśmy", "jesteście", "są"], "answer": "są", "grammar_point": "pan-pani", "explanation": "Państwo = oni → są."}]}, {"block_id": "g2", "exercise_type": "fill-in-blank", "title": "2. Koniugacja -m, -sz", "instruction": "Proszę uzupełnić. Wpisz czasownik z nawiasu w dobrej formie.", "instruction_uk": "я → -m, ти → -sz, він / вона / pan / pani → без закінчення.", "part": 1, "items": [{"id": "g2-1", "text": "(Ja) ___ w Krakowie. (mieszkać)", "answer": "mieszkam", "grammar_point": "koniugacja-m-sz"}, {"id": "g2-2", "text": "Jak ___ ta pani? (nazywać się)", "answer": "się nazywa", "accept": ["nazywa się"], "grammar_point": "koniugacja-m-sz"}, {"id": "g2-3", "text": "Ty ___ po polsku? (rozumieć)", "answer": "rozumiesz", "grammar_point": "koniugacja-m-sz"}, {"id": "g2-4", "text": "Oni ___ w tenisa, a my nie. (grać)", "answer": "grają", "grammar_point": "koniugacja-m-sz"}, {"id": "g2-5", "text": "(My) ___ nowy słownik. (mieć)", "answer": "mamy", "grammar_point": "koniugacja-m-sz"}, {"id": "g2-6", "text": "Gdzie ___ państwo Kowalscy? (mieszkać)", "answer": "mieszkają", "grammar_point": "koniugacja-m-sz"}, {"id": "g2-7", "text": "Wy ___ długopis? (mieć)", "answer": "macie", "grammar_point": "koniugacja-m-sz"}, {"id": "g2-8", "text": "Przepraszam, pan ___? (rozumieć)", "answer": "rozumie", "grammar_point": "pan-pani"}, {"id": "g2-9", "text": "Ty ___ na gitarze? (grać)", "answer": "grasz", "grammar_point": "koniugacja-m-sz"}]}, {"block_id": "g3", "exercise_type": "fill-in-blank", "title": "3. Ten, ta, to", "instruction": "Co pasuje? Ten (on), ta (ona) czy to (ono)?", "part": 1, "items": [{"id": "g3-1", "text": "___ długopis jest czarny.", "options": ["Ten", "Ta", "To"], "answer": "Ten", "grammar_point": "rodzaj", "explanation": "Długopis to on (ручка — ale po polsku rodzaj męski)."}, {"id": "g3-2", "text": "___ krzesło jest stare.", "options": ["Ten", "Ta", "To"], "answer": "To", "grammar_point": "rodzaj", "explanation": "Krzesło kończy się na -o → ono."}, {"id": "g3-3", "text": "___ kubek jest biały.", "options": ["Ten", "Ta", "To"], "answer": "Ten", "grammar_point": "rodzaj", "explanation": "Kubek kończy się na spółgłoskę → on."}, {"id": "g3-4", "text": "___ komórka jest nowa.", "options": ["Ten", "Ta", "To"], "answer": "Ta", "grammar_point": "rodzaj"}, {"id": "g3-5", "text": "___ okno jest duże.", "options": ["Ten", "Ta", "To"], "answer": "To", "grammar_point": "rodzaj"}, {"id": "g3-6", "text": "___ noc jest czarna.", "options": ["Ten", "Ta", "To"], "answer": "Ta", "grammar_point": "rodzaj", "explanation": "Wyjątek: noc to ona."}, {"id": "g3-7", "text": "___ kolega jest miły.", "options": ["Ten", "Ta", "To"], "answer": "Ten", "grammar_point": "rodzaj", "explanation": "Kolega ma -a, ale to mężczyzna → on."}, {"id": "g3-8", "text": "___ imię jest fajne.", "options": ["Ten", "Ta", "To"], "answer": "To", "grammar_point": "rodzaj", "explanation": "Imię (-ę) to ono."}, {"id": "g3-9", "text": "___ pani jest sympatyczna.", "options": ["Ten", "Ta", "To"], "answer": "Ta", "grammar_point": "rodzaj", "explanation": "Pani (-i) to ona."}]}, {"block_id": "g4", "exercise_type": "fill-in-blank", "title": "4. Jaki? Jaka? Jakie?", "instruction": "Proszę wybrać dobrą odpowiedź.", "part": 2, "items": [{"id": "g4-1", "text": "Ta torba jest ___.", "options": ["nowy", "nowa", "nowe"], "answer": "nowa", "grammar_point": "przymiotnik-zgoda"}, {"id": "g4-2", "text": "To krzesło jest ___.", "options": ["stary", "stara", "stare"], "answer": "stare", "grammar_point": "przymiotnik-zgoda"}, {"id": "g4-3", "text": "Ten kubek jest ___.", "options": ["biały", "biała", "białe"], "answer": "biały", "grammar_point": "przymiotnik-zgoda"}, {"id": "g4-4", "text": "Ta komórka jest ___.", "options": ["czarny", "czarna", "czarne"], "answer": "czarna", "grammar_point": "przymiotnik-zgoda"}, {"id": "g4-5", "text": "To okno jest ___.", "options": ["duży", "duża", "duże"], "answer": "duże", "grammar_point": "przymiotnik-zgoda"}, {"id": "g4-6", "text": "Ten kolega jest ___.", "options": ["miły", "miła", "miłe"], "answer": "miły", "grammar_point": "przymiotnik-zgoda", "explanation": "Kolega to on → miły."}, {"id": "g4-7", "text": "To radio jest ___.", "options": ["japoński", "japońska", "japońskie"], "answer": "japońskie", "grammar_point": "przymiotnik-zgoda", "explanation": "Po k: on -i (japoński), ono -ie (japońskie)."}, {"id": "g4-8", "text": "To jest ___ herbata.", "options": ["zielony", "zielona", "zielone"], "answer": "zielona", "grammar_point": "przymiotnik-zgoda"}, {"id": "g4-9", "text": "Ten zeszyt jest ___.", "options": ["żółty", "żółta", "żółte"], "answer": "żółty", "grammar_point": "przymiotnik-zgoda"}]}, {"block_id": "g5", "part": 2, "exercise_type": "sentence-building", "title": "5. Proszę ułożyć zdania", "instruction": "Klikaj słowa po kolei i ułóż pytanie albo zdanie.", "instruction_uk": "Натискай на слова в правильному порядку.", "items": [{"id": "g5-1", "words": ["Skąd", "pan", "jest?"], "answer": "Skąd pan jest?", "grammar_point": "pytania"}, {"id": "g5-2", "words": ["Gdzie", "pani", "mieszka?"], "answer": "Gdzie pani mieszka?", "grammar_point": "pytania"}, {"id": "g5-3", "words": ["Jak", "masz", "na", "imię?"], "answer": "Jak masz na imię?", "grammar_point": "pytania"}, {"id": "g5-4", "words": ["Dlaczego", "uczysz", "się", "polskiego?"], "answer": "Dlaczego uczysz się polskiego?", "grammar_point": "pytania"}, {"id": "g5-5", "words": ["Czy", "to", "jest", "słownik?"], "answer": "Czy to jest słownik?", "grammar_point": "czy"}, {"id": "g5-6", "words": ["To", "nie", "jest", "ołówek."], "answer": "To nie jest ołówek.", "grammar_point": "czy"}, {"id": "g5-7", "words": ["Uczę", "się", "polskiego,", "żeby", "pracować", "w", "Polsce."], "answer": "Uczę się polskiego, żeby pracować w Polsce.", "grammar_point": "bo-zeby"}, {"id": "g5-8", "words": ["Co", "to", "znaczy", "„zeszyt”?"], "answer": "Co to znaczy zeszyt?", "grammar_point": "na-lekcji"}]}, {"block_id": "g6", "exercise_type": "matching", "title": "6. Pytanie i odpowiedź", "instruction": "Proszę połączyć pytanie z odpowiedzią.", "part": 2, "items": [{"id": "g6-1", "left": "Co słychać?", "right": "Dziękuję, wszystko w porządku.", "grammar_point": "dialog"}, {"id": "g6-2", "left": "Jak się pan nazywa?", "right": "Nazywam się Nowak.", "grammar_point": "dialog"}, {"id": "g6-3", "left": "Skąd jesteś?", "right": "Jestem z Ukrainy.", "grammar_point": "dialog"}, {"id": "g6-4", "left": "Gdzie mieszkasz?", "right": "W Krakowie, ulica Długa 5.", "grammar_point": "dialog"}, {"id": "g6-5", "left": "Co to jest?", "right": "To jest klucz.", "grammar_point": "dialog"}, {"id": "g6-6", "left": "Kto to jest?", "right": "To jest nowa studentka.", "grammar_point": "dialog"}, {"id": "g6-7", "left": "Czy to jest zeszyt?", "right": "Nie, to jest książka.", "grammar_point": "dialog"}, {"id": "g6-8", "left": "Dlaczego uczysz się polskiego?", "right": "Bo chcę studiować w Polsce.", "grammar_point": "dialog"}]}, {"block_id": "g7", "exercise_type": "fill-in-blank", "title": "7. Pułapki z ukraińskiego", "instruction": "Co pasuje? Uwaga na ukraiński!", "part": 2, "items": [{"id": "g7-1", "text": "— Co słychać? — Dziękuję, dobrze, ___", "options": ["a ty?", "a u ciebie?"], "answer": "a u ciebie?", "grammar_point": "kalki-uk", "explanation": "Na „Co słychać?” odpowiadamy: …a u ciebie? (a u pana? a u pani?)."}, {"id": "g7-2", "text": "Mam ___ i zeszyt.", "options": ["długopis", "rączkę"], "answer": "długopis", "grammar_point": "kalki-uk", "explanation": "Ручка для письма — długopis. Rączka to маленька рука або ручка від сумки."}, {"id": "g7-3", "text": "Jak ___ na imię?", "options": ["masz", "jesteś"], "answer": "masz", "grammar_point": "kalki-uk", "explanation": "Jak masz na imię? = Як тебе звати?"}, {"id": "g7-4", "text": "(do pana w sekretariacie) Skąd ___?", "options": ["pan jest", "wy jesteście"], "answer": "pan jest", "grammar_point": "pan-pani", "explanation": "Do jednej osoby oficjalnie: pan / pani, nie „wy”."}, {"id": "g7-5", "text": "___ krzesło jest nowe.", "options": ["Ten", "To"], "answer": "To", "grammar_point": "kalki-uk", "explanation": "Стілець — on, ale krzesło — ono."}, {"id": "g7-6", "text": "Dziękuję, wszystko ___.", "options": ["dobry", "dobrze"], "answer": "dobrze", "grammar_point": "kalki-uk", "explanation": "Jak? — dobrze. Jaki? — dobry (dobry słownik)."}]}, {"block_id": "t1", "exercise_type": "true-false", "title": "Czytanie: prawda czy fałsz?", "instruction": "Proszę przeczytać tekst i odpowiedzieć: prawda czy fałsz?", "instruction_uk": "Прочитай тексти й вибери: Prawda (правда) чи Fałsz (неправда).", "items": [{"id": "t1-1", "statement": "Olena jest z Ukrainy i mieszka w Krakowie.", "answer": true, "grammar_point": "czytanie"}, {"id": "t1-2", "statement": "Marco mieszka w Rzymie.", "answer": false, "grammar_point": "czytanie", "explanation": "Marco jest z Włoch, ale mieszka w Warszawie."}, {"id": "t1-3", "statement": "Marco gra na gitarze.", "answer": false, "grammar_point": "czytanie", "explanation": "Marco gra w tenisa. Na gitarze gra Olena."}, {"id": "t1-4", "statement": "Hanna uczy się polskiego, żeby studiować w Krakowie.", "answer": true, "grammar_point": "czytanie"}, {"id": "t1-5", "statement": "Hanna ma nowy zeszyt.", "answer": false, "grammar_point": "czytanie", "explanation": "Hanna ma stary zeszyt, ale bardzo dobry."}, {"id": "t1-6", "statement": "Tom mieszka w Krakowie z polską rodziną.", "answer": true, "grammar_point": "czytanie"}, {"id": "t1-7", "statement": "Słownik Marco jest mały i zielony.", "answer": false, "grammar_point": "czytanie", "explanation": "Słownik Marco jest duży i czerwony."}]}]}, "comm": {"lesson_id": "pl-kpk1-r01-powtorka", "exercise_type": "flip-task", "title": "Zadania komunikacyjne: sekretariat, nowa osoba, „nie rozumiem” i torba", "instruction": "Odwróć kartę, przeczytaj sytuację i rozmawiaj. Potem zamiana ról.", "instruction_uk": "Переверни картку, прочитай ситуацію й говори. Потім мінятеся ролями.", "estimated_minutes": 20, "items": [{"id": "c1", "mode": "read-then-play", "front_title": "W sekretariacie szkoły", "back_scenario": "Pierwszy dzień w szkole językowej w Krakowie. Nauczyciel jest sekretarką. Najpierw przeczytajcie dialog w rolach. Potem rozmowa jeszcze raz — ale teraz to Ty i Twoje dane.", "back_checklist": ["Przywitaj się oficjalnie.", "Powiedz imię i nazwisko. Przeliteruj nazwisko.", "Powiedz, skąd jesteś.", "Podaj adres i numer telefonu.", "Powiedz, dlaczego uczysz się polskiego: bo… / żeby…", "Podziękuj i pożegnaj się."], "model_dialogue": [{"speaker": "Sekretarka", "voice": "pl-PL-female", "line": "Dzień dobry! Jak się pan nazywa?"}, {"speaker": "Andrij", "voice": "pl-PL-male", "line": "Dzień dobry. Nazywam się Andrij Melnyk."}, {"speaker": "Sekretarka", "voice": "pl-PL-female", "line": "Przepraszam, proszę przeliterować nazwisko."}, {"speaker": "Andrij", "voice": "pl-PL-male", "line": "M-e-l-n-y-k."}, {"speaker": "Sekretarka", "voice": "pl-PL-female", "line": "Dziękuję. Skąd pan jest?"}, {"speaker": "Andrij", "voice": "pl-PL-male", "line": "Jestem z Ukrainy, ale teraz mieszkam w Krakowie."}, {"speaker": "Sekretarka", "voice": "pl-PL-female", "line": "A adres w Krakowie?"}, {"speaker": "Andrij", "voice": "pl-PL-male", "line": "Ulica Spacerowa 17 przez 4."}, {"speaker": "Sekretarka", "voice": "pl-PL-female", "line": "Dobrze. Numer telefonu?"}, {"speaker": "Andrij", "voice": "pl-PL-male", "line": "21 08 19 27."}, {"speaker": "Sekretarka", "voice": "pl-PL-female", "line": "A dlaczego uczy się pan polskiego?"}, {"speaker": "Andrij", "voice": "pl-PL-male", "line": "Uczę się polskiego, żeby pracować w Polsce."}, {"speaker": "Sekretarka", "voice": "pl-PL-female", "line": "Świetnie. Grupa A1, klasa numer 12. Miłej lekcji!"}, {"speaker": "Andrij", "voice": "pl-PL-male", "line": "Dziękuję bardzo. Do widzenia!"}]}, {"id": "c2", "mode": "play", "front_title": "Nowa osoba w grupie", "back_scenario": "Przerwa na kursie. W grupie jest nowa osoba — to nauczyciel. Nie znacie się. Rozmawiacie nieoficjalnie: na „ty”. Zapytaj o wszystko!", "back_checklist": ["Cześć! Przedstaw się i powiedz: Bardzo mi miło.", "Zapytaj, jak ta osoba ma na imię i skąd jest.", "Zapytaj, gdzie mieszka.", "Zapytaj, dlaczego uczy się polskiego.", "Zapytaj, czy gra w tenisa albo na gitarze.", "Na koniec: Cześć, do jutra!"]}, {"id": "c3", "mode": "play", "front_title": "Nie rozumiem!", "back_scenario": "Nauczyciel mówi szybko i używa słów, których nie znasz. Nie panikuj! Ratuj rozmowę po polsku — bez ukraińskiego i bez angielskiego.", "back_checklist": ["Przepraszam, nie rozumiem.", "Proszę powtórzyć.", "Co to znaczy „…”?", "Jak się mówi po polsku „…”?", "Proszę przeliterować.", "Aha, rozumiem! Dziękuję."]}, {"id": "c4", "mode": "play", "front_title": "Co jest w torbie?", "back_scenario": "Weź torbę. Pokaż na kamerze pięć rzeczy i powiedz o nich wszystko, co umiesz. Potem nauczyciel pokazuje swoje rzeczy, a Ty pytasz.", "back_checklist": ["To jest… (co?)", "Ten / ta / to … jest … — jaki to kolor?", "Nowy czy stary? Duży czy mały? Dobry czy zły?", "Nauczyciel pyta: Czy to jest…? — Tak, to jest… / Nie, to nie jest…", "Teraz Ty pytasz: Co to jest? Jaki to kolor?"]}]}, "hw": {"lesson_id": "pl-kpk1-r01-powtorka", "exercise_type": "fill-in-blank", "title": "Praca domowa: powtórka lekcji 1–3", "instruction": "Trzy bloki: słowa, formy i wiadomość od Kasi.", "instruction_uk": "Три блоки: слова, форми і повідомлення від Касі.", "estimated_minutes": 15, "blocks": [{"block_id": "h1", "exercise_type": "matching", "title": "1. Przeciwieństwa", "instruction": "Proszę połączyć słowo z przeciwieństwem.", "instruction_uk": "Протилежності: з'єднай пари.", "items": [{"id": "h1-1", "left": "nowy", "right": "stary", "grammar_point": "slownictwo"}, {"id": "h1-2", "left": "duży", "right": "mały", "grammar_point": "slownictwo"}, {"id": "h1-3", "left": "dobry", "right": "zły", "grammar_point": "slownictwo"}, {"id": "h1-4", "left": "tu", "right": "tam", "grammar_point": "slownictwo"}, {"id": "h1-5", "left": "na lewo", "right": "na prawo", "grammar_point": "slownictwo"}, {"id": "h1-6", "left": "Dzień dobry!", "right": "Do widzenia!", "grammar_point": "slownictwo"}, {"id": "h1-7", "left": "rozumiem", "right": "nie rozumiem", "grammar_point": "slownictwo"}, {"id": "h1-8", "left": "czarny", "right": "biały", "grammar_point": "slownictwo"}]}, {"block_id": "h2", "exercise_type": "fill-in-blank", "title": "2. Dobra forma", "instruction": "Proszę uzupełnić. Wpisz słowo z nawiasu w dobrej formie.", "items": [{"id": "h2-1", "text": "Moja koleżanka ___ Ewa. (nazywać się)", "answer": "nazywa się", "accept": ["się nazywa"], "grammar_point": "koniugacja-m-sz"}, {"id": "h2-2", "text": "Ewa i Piotr ___ z Polski. (być)", "answer": "są", "grammar_point": "byc"}, {"id": "h2-3", "text": "Czy oni ___ w Polsce? (mieszkać)", "answer": "mieszkają", "grammar_point": "koniugacja-m-sz"}, {"id": "h2-4", "text": "Ty ___ słownik polsko-ukraiński? (mieć)", "answer": "masz", "grammar_point": "koniugacja-m-sz"}, {"id": "h2-5", "text": "Przepraszam, (ja) nie ___. Proszę powtórzyć. (rozumieć)", "answer": "rozumiem", "grammar_point": "koniugacja-m-sz"}, {"id": "h2-6", "text": "Wy ___ na gitarze? (grać)", "answer": "gracie", "grammar_point": "koniugacja-m-sz"}, {"id": "h2-7", "text": "___ mapa jest bardzo stara. (ten / ta / to)", "answer": "Ta", "grammar_point": "rodzaj"}, {"id": "h2-8", "text": "To dziecko jest ___. (mały)", "answer": "małe", "grammar_point": "przymiotnik-zgoda"}, {"id": "h2-9", "text": "Ta tablica jest ___. (czarny)", "answer": "czarna", "grammar_point": "przymiotnik-zgoda"}, {"id": "h2-10", "text": "Ten segregator jest ___. (niebieski)", "answer": "niebieski", "grammar_point": "przymiotnik-zgoda"}]}, {"block_id": "h3", "exercise_type": "drag-and-drop", "title": "3. Wiadomość od Kasi", "instruction": "Kasia pisze do nowego kolegi z kursu. Przeciągnij słowa w luki. Trzy słowa są niepotrzebne.", "instruction_uk": "Перетягни слова в пропуски. Три слова зайві.", "bank": ["Mam", "mieszkam", "bo", "numer", "słownik", "jesteś", "mieszkasz", "żeby", "jest", "masz"], "items": [{"id": "h3-1", "text": "Cześć! ___ na imię Kasia.", "answer": "Mam", "grammar_point": "koniugacja-m-sz"}, {"id": "h3-2", "text": "Jestem z Polski, ale teraz ___ w Paryżu.", "answer": "mieszkam", "grammar_point": "koniugacja-m-sz"}, {"id": "h3-3", "text": "Uczę się francuskiego, ___ chcę tu pracować.", "answer": "bo", "grammar_point": "bo-zeby", "explanation": "bo + chcę (forma osobowa); żeby + bezokolicznik (żeby pracować)."}, {"id": "h3-4", "text": "Mój ___ telefonu to 14 27 03 11.", "answer": "numer", "grammar_point": "slownictwo"}, {"id": "h3-5", "text": "Mam nowy ___ polsko-francuski. Jest zielony i bardzo dobry!", "answer": "słownik", "grammar_point": "slownictwo"}, {"id": "h3-6", "text": "A ty? Skąd ___?", "answer": "jesteś", "grammar_point": "byc"}, {"id": "h3-7", "text": "Napisz, gdzie ___ i dlaczego uczysz się polskiego!", "answer": "mieszkasz", "grammar_point": "koniugacja-m-sz"}]}]}};
const $ = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null) e.setAttribute(k, v); } for (const c of kids.flat()) { if (c == null) continue; e.append(c.nodeType ? c : document.createTextNode(c)); } return e; };
const norm = s => String(s).trim().replace(/\s+/g, ' ').toLowerCase().replace(/[.!?…]+$/u, '').replace(/[„”«»"']/g, '').replace(/[–—]/g, '-').trim();
const strip = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
function match(given, expected, accept) {
  const g = norm(given); if (!g) return { ok: false };
  const pool = [expected, ...(accept || [])];
  if (pool.map(norm).includes(g)) return { ok: true };
  const hit = pool.find(a => strip(a) === strip(g));
  if (hit) return { ok: true, hint: '↳ z ogonkami: ' + hit };
  return { ok: false };
}
const shuffle = (a, seed) => { const r = [...a]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };

const params = new URLSearchParams('view=hw');
const view = params.get('view') || 'grammar';
const app = document.getElementById('app');

function header(eyebrow, title, instr, uk) {
  app.append($('p', { class: 'eyebrow' }, eyebrow), $('h1', {}, title));
  if (instr) app.append($('p', {}, instr));
  if (uk) app.append($('p', { class: 'uk' }, uk));
}

function expandBlocks(spec) {
  if (!spec) return null; const out = [];
  for (const p of spec.split(',')) { const m = p.match(/^([a-z]+)(\d+)-([a-z]*)(\d+)$/i); if (m) { for (let i = +m[2]; i <= +m[4]; i++) out.push(m[1] + i); } else out.push(p); }
  return out;
}

function renderBlocks(data, eyebrow) {
  const ids = expandBlocks(params.get('blocks'));
  const blocks = ids ? data.blocks.filter(b => ids.includes(b.block_id)) : data.blocks;
  const single = blocks.length === 1;
  header(eyebrow, single ? blocks[0].title.replace(/^\d+\.\s*/, '') : data.title, single ? null : data.instruction, single ? null : data.instruction_uk);
  const tabs = $('div', { class: 'tabs' }); const body = $('div');
  if (!single) app.append(tabs);
  app.append(body);
  const show = i => { [...tabs.children].forEach((t, k) => t.classList.toggle('on', k === i)); body.innerHTML = ''; renderBlock(blocks[i], body); };
  blocks.forEach((b, i) => tabs.append($('button', { onclick: () => show(i) }, b.title)));
  show(0);
}

function renderBlock(b, root) {
  root.append($('p', { class: 'q' }, $('b', {}, b.instruction || '')));
  if (b.instruction_uk) root.append($('p', { class: 'uk' }, b.instruction_uk));
  const type = b.exercise_type;
  if (type === 'matching') return renderMatching(b, root);
  if (type === 'sentence-building') return b.items.forEach(it => renderSB(it, root));
  if (type === 'drag-and-drop') {
    const answers = b.items.map(i => i.answer);
    const bank = shuffle([...new Set([...(b.bank || []), ...answers])], 3);
    return b.items.forEach(it => renderChoice({ ...it, options: bank }, root, false));
  }
  if (type === 'true-false') return b.items.forEach(it => renderChoice({ text: it.statement, options: ['Prawda', 'Fałsz'], answer: it.answer ? 'Prawda' : 'Fałsz', explanation: it.explanation }, root, true));
  b.items.forEach(it => it.options ? renderChoice(it, root, false) : renderInput(it, root));
}

function renderChoice(it, root) {
  const box = $('div', { class: 'item' }, $('p', { class: 'q' }, it.text));
  const row = $('div', { class: 'row' }); const fb = $('span', { class: 'fb' });
  let done = false;
  it.options.forEach(opt => {
    const c = $('button', { class: 'chip', onclick: () => {
      if (done) return;
      const r = match(opt, it.answer, it.accept);
      [...row.querySelectorAll('.chip')].forEach(x => x.classList.remove('no'));
      if (r.ok) { c.classList.add('ok'); done = true; fb.className = 'fb ok'; fb.textContent = '✓ Dobrze!' + (it.explanation ? ' ' + it.explanation : ''); }
      else { c.classList.add('no'); fb.className = 'fb no'; fb.textContent = it.explanation ? '✗ ' + it.explanation : '✗ Spróbuj jeszcze raz.'; }
    } }, opt);
    row.append(c);
  });
  box.append(row, $('div', {}, fb)); root.append(box);
}

function renderInput(it, root) {
  const box = $('div', { class: 'item' }, $('p', { class: 'q' }, it.text));
  const inp = $('input', { class: 'blank', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  const fb = $('span', { class: 'fb' }); let fails = 0;
  const check = () => {
    const r = match(inp.value, it.answer, it.accept);
    inp.classList.toggle('ok', r.ok); inp.classList.toggle('no', !r.ok);
    if (r.ok) { fb.className = 'fb ok'; fb.textContent = '✓ Dobrze!' + (r.hint ? ' ' + r.hint : ''); }
    else { fails++; fb.className = 'fb no'; fb.textContent = fails >= 2 ? '↳ ' + it.answer + (it.explanation ? ' — ' + it.explanation : '') : '✗ Spróbuj jeszcze raz.'; }
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  box.append($('div', { class: 'row' }, inp, $('button', { class: 'btn', onclick: check }, 'Sprawdź'), fb));
  root.append(box);
}

function renderSB(it, root) {
  const box = $('div', { class: 'item' });
  const out = $('div', { class: 'sb-out' }); const pool = $('div', { class: 'row' }); const fb = $('span', { class: 'fb' });
  const reset = () => { out.innerHTML = ''; pool.innerHTML = ''; fb.textContent = ''; out.className = 'sb-out'; shuffle(it.words, it.words.length * 13 + it.id.length).forEach(w => pool.append(mk(w))); };
  const mk = w => { const c = $('button', { class: 'chip', onclick: () => { (c.parentNode === pool ? out : pool).append(c); } }, w); return c; };
  const check = () => { const s = [...out.children].map(c => c.textContent).join(' '); const r = match(s, it.answer); fb.className = 'fb ' + (r.ok ? 'ok' : 'no'); fb.textContent = r.ok ? '✓ Dobrze!' : '✗ Spróbuj jeszcze raz.'; out.style.borderColor = r.ok ? 'var(--ok)' : 'var(--no)'; };
  box.append(out, pool, $('div', { class: 'row', style: 'margin-top:8px' }, $('button', { class: 'btn', onclick: check }, 'Sprawdź'), $('button', { class: 'btn ghost', onclick: reset }, 'Od nowa'), fb));
  reset(); root.append(box);
}

function renderMatching(b, root) {
  const lefts = b.items.map(i => i.left), rights = shuffle(b.items.map(i => i.right), b.items.length * 5 + 1);
  let sel = null, done = 0;
  const L = $('div', { class: 'col' }), R = $('div', { class: 'col' }); const fb = $('p', { class: 'fb' });
  const lbtn = lefts.map((t, i) => { const c = $('button', { class: 'chip', onclick: () => { if (c.disabled) return; lbtn.forEach(x => x.classList.remove('sel')); c.classList.add('sel'); sel = i; } }, t); L.append(c); return c; });
  rights.forEach(t => { const c = $('button', { class: 'chip', onclick: () => {
    if (sel === null || c.disabled) { fb.className = 'fb'; fb.textContent = 'Najpierw kliknij słowo po lewej.'; return; }
    if (b.items[sel].right === t) { c.classList.add('ok'); c.disabled = true; lbtn[sel].classList.remove('sel'); lbtn[sel].classList.add('ok'); lbtn[sel].disabled = true; lbtn[sel].textContent += ' → ' + t; sel = null; done++; fb.className = 'fb ok'; fb.textContent = done === b.items.length ? '✓ Wszystko dobrze!' : '✓'; }
    else { c.classList.add('no'); setTimeout(() => c.classList.remove('no'), 600); fb.className = 'fb no'; fb.textContent = '✗ Nie pasuje.'; }
  } }, t); R.append(c); });
  root.append($('div', { class: 'match' }, L, R), fb);
}

function renderVocab(d) {
  header('słownictwo', d.title, d.instruction);
  const filter = $('div', { class: 'filter' }); const grid = $('div', { class: 'cards' });
  const draw = g => { grid.innerHTML = ''; [...filter.children].forEach(b => b.classList.toggle('on', b.dataset.g === (g ?? ''))); d.items.filter(i => g == null || i.group === g).forEach(it => {
    const gi = d.groups.indexOf(it.group);
    const c = $('div', { class: 'vc', onclick: () => c.classList.toggle('flip') }, $('div', { class: 'in' },
      $('div', { class: 'f g' + gi }, it.term, $('small', {}, it.group)),
      $('div', { class: 'b g' + gi }, $('div', { class: 'tr' }, it.translation_uk), $('div', {}, it.definition), $('div', { class: 'ex' }, it.example))));
    grid.append(c); }); };
  const all = $('button', { onclick: () => draw(null) }, 'Wszystkie'); all.dataset.g = ''; filter.append(all);
  d.groups.forEach(g => { const b = $('button', { onclick: () => draw(g) }, g); b.dataset.g = g; filter.append(b); });
  app.append(filter, grid); draw(null);
}

function renderComm(d) {
  header('zadania komunikacyjne', d.title, d.instruction, d.instruction_uk);
  const grid = $('div', { class: 'flips' }); const back = $('div');
  d.items.forEach((it, i) => grid.append($('div', { class: 'ft ftc' + (i % 4), onclick: () => {
    back.innerHTML = '';
    const b = $('div', { class: 'ftback' }, $('h3', {}, it.front_title), $('p', {}, it.back_scenario), $('b', {}, 'Plan rozmowy:'), $('ul', {}, it.back_checklist.map(x => $('li', {}, x))));
    if (it.model_dialogue) b.append($('p', { style: 'margin-top:12px' }, $('b', {}, 'Dialog — przeczytajcie w rolach:')), $('div', { class: 'dlg' }, it.model_dialogue.map(l => $('p', {}, $('b', {}, l.speaker + ': '), l.line))));
    back.append(b); b.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } }, $('h3', {}, it.front_title), $('div', { class: 'hint' }, 'kliknij, żeby odwrócić →'))));
  app.append(grid, back);
}

if (view === 'vocab') renderVocab(DATA.vocab);
else if (view === 'comm') renderComm(DATA.comm);
else if (view === 'hw') renderBlocks(DATA.hw, 'praca domowa');
else renderBlocks(DATA.grammar, 'powtórka');
</script>
</body>
</html>
