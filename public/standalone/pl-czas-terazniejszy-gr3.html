<head>

<title>Werba Way · Grupa III: -ę, -isz / -ysz</title>
<style>
:root{--bg:#F6F1E7;--paper:#FFFDF8;--ink:#1f2a37;--soft:#6b7280;--line:#e7dfcf;--ok:#1f8a5b;--okbg:#e3f4ea;--no:#c0392b;--nobg:#fbe5e1;--acc:#F7D774;--chip:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px;box-shadow:0 2px 0 rgba(0,0,0,.04)}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:0}
h1{font-size:22px;margin:4px 0 6px}
.uk{color:var(--soft);font-size:14px;margin:2px 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:#e8c14d;font-weight:600}
.item{border-top:1px dashed var(--line);padding:12px 0}
.item:first-child{border-top:0}
.q{margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
.chip.sel{border-color:#c9a227;background:#fff6d6}
.chip.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.chip.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.chip:disabled{opacity:.55;cursor:default}
input.blank{font:inherit;border:0;border-bottom:2px dashed #9ca3af;background:#fff;padding:6px 6px;min-width:180px}
input.blank.ok{border-color:var(--ok);background:var(--okbg)}
input.blank.no{border-color:var(--no);background:var(--nobg)}
.btn{border:0;background:#1f2a37;color:#fff;border-radius:10px;padding:7px 14px;font:inherit;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.fb{font-size:14px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.sb-out{min-height:44px;border:2px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;background:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.match .chip{text-align:left}
.score{margin:14px 0 6px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:10px}
.vc{perspective:900px;height:170px;cursor:pointer}
.vc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.vc.flip .in{transform:rotateY(180deg)}
.vc .f,.vc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;justify-content:center}
.vc .f{background:#fff;text-align:center;font-weight:700;font-size:18px}
.vc .f small{display:block;font-weight:400;font-size:12px;color:var(--soft);margin-top:6px}
.vc .b{background:#fffaf0;transform:rotateY(180deg);font-size:14px;gap:4px}
.vc .b .tr{font-weight:700}
.vc .b .ex{font-style:italic;color:#374151}
.g0{border-top:4px solid #f0a35e}.g1{border-top:4px solid #5b9bd5}.g2{border-top:4px solid #5cb85c}.g3{border-top:4px solid #9b6fd0}.g4{border-top:4px solid #e07ab0}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:10px}
.ft{border-radius:12px;border:1px solid var(--line);padding:14px;cursor:pointer;min-height:110px}
.ft h3{margin:0 0 6px;font-size:17px}
.ft .hint{font-size:13px;color:var(--soft);font-style:italic}
.ftc0{background:#fff1b8}.ftc1{background:#d8efe3}.ftc2{background:#dcebf9}.ftc3{background:#f9ddd3}
.ftback{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.ftback ul{margin:6px 0 0 18px;padding:0}
.dlg p{margin:4px 0}
.filter{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.filter button.on{background:#1f2a37;color:#fff}
@media (max-width:560px){.match{grid-template-columns:1fr}}
</style>
</head>

{"id": "g14-1", "text": "Ja ___ (gotować) obiad.", "answer": "gotuję", "grammar_point": "czas-terazniejszy"}, {"id": "g14-2", "text": "Oni ___ (mieszkać) w Gdańsku.", "answer": "mieszkają", "grammar_point": "czas-terazniejszy"}, {"id": "g14-3", "text": "Czy pani ___ (mówić) po angielsku?", "answer": "mówi", "grammar_point": "czas-terazniejszy"}, {"id": "g14-4", "text": "Ja ___ (mieć) siostrę.", "answer": "mam", "grammar_point": "czas-terazniejszy"}, {"id": "g14-5", "text": "Co wy ___ (robić) w weekend?", "answer": "robicie", "grammar_point": "czas-terazniejszy"}, {"id": "g14-6", "text": "Ona ___ (pisać) maile.", "answer": "pisze", "grammar_point": "czas-terazniejszy"}, {"id": "g14-7", "text": "My ___ (jeść) kolację.", "answer": "jemy", "grammar_point": "czas-terazniejszy"}, {"id": "g14-8", "text": "Dlaczego ty nie ___ (odpowiadać)?", "answer": "odpowiadasz", "grammar_point": "czas-terazniejszy"}, {"id": "g14-9", "text": "Oni jeszcze nie ___ (rozumieć) wszystkiego.", "answer": "rozumieją", "grammar_point": "czas-terazniejszy"}, {"id": "g14-10", "text": "Wieczorami ___ (uczyć się). (ja)", "answer": "uczę się", "grammar_point": "czas-terazniejszy"}]}, {"block_id": "g15", "title": "C. Napisz", "exercise_type": "fill-in-blank", "instruction": "Napisz po polsku.", "instruction_uk": "Напиши по-польски. Можно с местоимением или без.", "items": [{"id": "g15-1", "text": "Я работаю и учусь.", "answer": "Pracuję i uczę się.", "grammar_point": "czas-terazniejszy", "accept": ["Ja pracuję i się uczę.", "Ja pracuję i uczę się.", "Pracuję i się uczę."]}, {"id": "g15-2", "text": "Что ты пьёшь?", "answer": "Co pijesz?", "grammar_point": "czas-terazniejszy", "accept": ["Co ty pijesz?"]}, {"id": "g15-3", "text": "Мы не знаем, где они живут.", "answer": "Nie wiemy, gdzie oni mieszkają.", "grammar_point": "czas-terazniejszy", "accept": ["My nie wiemy gdzie mieszkają.", "My nie wiemy gdzie oni mieszkają.", "My nie wiemy, gdzie mieszkają.", "My nie wiemy, gdzie oni mieszkają.", "Nie wiemy g const $ = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null) e.setAttribute(k, v); } for (const c of kids.flat()) { if (c == null) continue; e.append(c.nodeType ? c : document.createTextNode(c)); } return e; };
const norm = s => String(s).trim().replace(/\s+/g, ' ').toLowerCase().replace(/[.!?…]+$/u, '').replace(/[„”«»"']/g, '').replace(/[–—]/g, '-').trim();
const strip = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
function match(given, expected, accept) {
  const g = norm(given); if (!g) return { ok: false };
  const pool = [expected, ...(accept || [])];
  if (pool.map(norm).includes(g)) return { ok: true };
  const hit = pool.find(a => strip(a) === strip(g));
  if (hit) return { ok: true, hint: '↳ z ogonkami: ' + hit };
  return { ok: false };
}
const shuffle = (a, seed) => { const r = [...a]; let s = seed || 7; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };

const params = new URLSearchParams('view=grammar&blocks=g7-g9');
const view = params.get('view') || 'grammar';
const app = document.getElementById('app');

function header(eyebrow, title, instr, uk) {
  app.append($('p', { class: 'eyebrow' }, eyebrow), $('h1', {}, title));
  if (instr) app.append($('p', {}, instr));
  if (uk) app.append($('p', { class: 'uk' }, uk));
}

function expandBlocks(spec) {
  if (!spec) return null; const out = [];
  for (const p of spec.split(',')) { const m = p.match(/^([a-z]+)(\d+)-([a-z]*)(\d+)$/i); if (m) { for (let i = +m[2]; i <= +m[4]; i++) out.push(m[1] + i); } else out.push(p); }
  return out;
}

function renderBlocks(data, eyebrow) {
  const ids = expandBlocks(params.get('blocks'));
  const blocks = ids ? data.blocks.filter(b => ids.includes(b.block_id)) : data.blocks;
  const single = blocks.length === 1;
  header(eyebrow, single ? blocks[0].title.replace(/^\d+\.\s*/, '') : data.title, single ? null : data.instruction, single ? null : data.instruction_uk);
  const tabs = $('div', { class: 'tabs' }); const body = $('div');
  if (!single) app.append(tabs);
  app.append(body);
  const show = i => { [...tabs.children].forEach((t, k) => t.classList.toggle('on', k === i)); body.innerHTML = ''; renderBlock(blocks[i], body); };
  blocks.forEach((b, i) => tabs.append($('button', { onclick: () => show(i) }, b.title)));
  show(0);
}

function renderBlock(b, root) {
  root.append($('p', { class: 'q' }, $('b', {}, b.instruction || '')));
  if (b.instruction_uk) root.append($('p', { class: 'uk' }, b.instruction_uk));
  const type = b.exercise_type;
  if (type === 'matching') return renderMatching(b, root);
  if (type === 'sentence-building') return b.items.forEach(it => renderSB(it, root));
  if (type === 'drag-and-drop') {
    const answers = b.items.map(i => i.answer);
    const bank = shuffle([...new Set([...(b.bank || []), ...answers])], 3);
    return b.items.forEach(it => renderChoice({ ...it, options: bank }, root, false));
  }
  if (type === 'true-false') return b.items.forEach(it => renderChoice({ text: it.statement, options: ['Prawda', 'Fałsz'], answer: it.answer ? 'Prawda' : 'Fałsz', explanation: it.explanation }, root, true));
  b.items.forEach(it => it.options ? renderChoice(it, root, false) : renderInput(it, root));
}

function renderChoice(it, root) {
  const box = $('div', { class: 'item' }, $('p', { class: 'q' }, it.text));
  const row = $('div', { class: 'row' }); const fb = $('span', { class: 'fb' });
  let done = false;
  it.options.forEach(opt => {
    const c = $('button', { class: 'chip', onclick: () => {
      if (done) return;
      const r = match(opt, it.answer, it.accept);
      [...row.querySelectorAll('.chip')].forEach(x => x.classList.remove('no'));
      if (r.ok) { c.classList.add('ok'); done = true; fb.className = 'fb ok'; fb.textContent = '✓ Dobrze!' + (it.explanation ? ' ' + it.explanation : ''); }
      else { c.classList.add('no'); fb.className = 'fb no'; fb.textContent = it.explanation ? '✗ ' + it.explanation : '✗ Spróbuj jeszcze raz.'; }
    } }, opt);
    row.append(c);
  });
  box.append(row, $('div', {}, fb)); root.append(box);
}

function renderInput(it, root) {
  const box = $('div', { class: 'item' }, $('p', { class: 'q' }, it.text));
  const inp = $('input', { class: 'blank', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  const fb = $('span', { class: 'fb' }); let fails = 0;
  const check = () => {
    const r = match(inp.value, it.answer, it.accept);
    inp.classList.toggle('ok', r.ok); inp.classList.toggle('no', !r.ok);
    if (r.ok) { fb.className = 'fb ok'; fb.textContent = '✓ Dobrze!' + (r.hint ? ' ' + r.hint : ''); }
    else { fails++; fb.className = 'fb no'; fb.textContent = fails >= 2 ? '↳ ' + it.answer + (it.explanation ? ' — ' + it.explanation : '') : '✗ Spróbuj jeszcze raz.'; }
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  box.append($('div', { class: 'row' }, inp, $('button', { class: 'btn', onclick: check }, 'Sprawdź'), fb));
  root.append(box);
}

function renderSB(it, root) {
  const box = $('div', { class: 'item' });
  const out = $('div', { class: 'sb-out' }); const pool = $('div', { class: 'row' }); const fb = $('span', { class: 'fb' });
  const reset = () => { out.innerHTML = ''; pool.innerHTML = ''; fb.textContent = ''; out.className = 'sb-out'; shuffle(it.words, it.words.length * 13 + it.id.length).forEach(w => pool.append(mk(w))); };
  const mk = w => { const c = $('button', { class: 'chip', onclick: () => { (c.parentNode === pool ? out : pool).append(c); } }, w); return c; };
  const check = () => { const s = [...out.children].map(c => c.textContent).join(' '); const r = match(s, it.answer); fb.className = 'fb ' + (r.ok ? 'ok' : 'no'); fb.textContent = r.ok ? '✓ Dobrze!' : '✗ Spróbuj jeszcze raz.'; out.style.borderColor = r.ok ? 'var(--ok)' : 'var(--no)'; };
  box.append(out, pool, $('div', { class: 'row', style: 'margin-top:8px' }, $('button', { class: 'btn', onclick: check }, 'Sprawdź'), $('button', { class: 'btn ghost', onclick: reset }, 'Od nowa'), fb));
  reset(); root.append(box);
}

function renderMatching(b, root) {
  const lefts = b.items.map(i => i.left), rights = shuffle(b.items.map(i => i.right), b.items.length * 5 + 1);
  let sel = null, done = 0;
  const L = $('div', { class: 'col' }), R = $('div', { class: 'col' }); const fb = $('p', { class: 'fb' });
  const lbtn = lefts.map((t, i) => { const c = $('button', { class: 'chip', onclick: () => { if (c.disabled) return; lbtn.forEach(x => x.classList.remove('sel')); c.classList.add('sel'); sel = i; } }, t); L.append(c); return c; });
  rights.forEach(t => { const c = $('button', { class: 'chip', onclick: () => {
    if (sel === null || c.disabled) { fb.className = 'fb'; fb.textContent = 'Najpierw kliknij słowo po lewej.'; return; }
    if (b.items[sel].right === t) { c.classList.add('ok'); c.disabled = true; lbtn[sel].classList.remove('sel'); lbtn[sel].classList.add('ok'); lbtn[sel].disabled = true; lbtn[sel].textContent += ' → ' + t; sel = null; done++; fb.className = 'fb ok'; fb.textContent = done === b.items.length ? '✓ Wszystko dobrze!' : '✓'; }
    else { c.classList.add('no'); setTimeout(() => c.classList.remove('no'), 600); fb.className = 'fb no'; fb.textContent = '✗ Nie pasuje.'; }
  } }, t); R.append(c); });
  root.append($('div', { class: 'match' }, L, R), fb);
}

function renderVocab(d) {
  header('słownictwo', d.title, d.instruction);
  const filter = $('div', { class: 'filter' }); const grid = $('div', { class: 'cards' });
  const draw = g => { grid.innerHTML = ''; [...filter.children].forEach(b => b.classList.toggle('on', b.dataset.g === (g ?? ''))); d.items.filter(i => g == null || i.group === g).forEach(it => {
    const gi = d.groups.indexOf(it.group);
    const c = $('div', { class: 'vc', onclick: () => c.classList.toggle('flip') }, $('div', { class: 'in' },
      $('div', { class: 'f g' + gi }, it.term, $('small', {}, it.group)),
      $('div', { class: 'b g' + gi }, $('div', { class: 'tr' }, it.translation_uk), $('div', {}, it.definition), $('div', { class: 'ex' }, it.example))));
    grid.append(c); }); };
  const all = $('button', { onclick: () => draw(null) }, 'Wszystkie'); all.dataset.g = ''; filter.append(all);
  d.groups.forEach(g => { const b = $('button', { onclick: () => draw(g) }, g); b.dataset.g = g; filter.append(b); });
  app.append(filter, grid); draw(null);
}

function renderComm(d) {
  header('zadania komunikacyjne', d.title, d.instruction, d.instruction_uk);
  const grid = $('div', { class: 'flips' }); const back = $('div');
  d.items.forEach((it, i) => grid.append($('div', { class: 'ft ftc' + (i % 4), onclick: () => {
    back.innerHTML = '';
    const b = $('div', { class: 'ftback' }, $('h3', {}, it.front_title), $('p', {}, it.back_scenario), $('b', {}, 'Plan rozmowy:'), $('ul', {}, it.back_checklist.map(x => $('li', {}, x))));
    if (it.model_dialogue) b.append($('p', { style: 'margin-top:12px' }, $('b', {}, 'Dialog — przeczytajcie w rolach:')), $('div', { class: 'dlg' }, it.model_dialogue.map(l => $('p', {}, $('b', {}, l.speaker + ': '), l.line))));
    back.append(b); b.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } }, $('h3', {}, it.front_title), $('div', { class: 'hint' }, 'kliknij, żeby odwrócić →'))));
  app.append(grid, back);
}

if (view === 'vocab') renderVocab(DATA.vocab);
else if (view === 'comm') renderComm(DATA.comm);
else if (view === 'hw') renderBlocks(DATA.hw, 'praca domowa');
else renderBlocks(DATA.grammar, 'czas teraźniejszy');
