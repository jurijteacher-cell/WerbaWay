<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werba Way — Wynalazki, które zmieniły historię ludzkości</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#FBF8F1; --paper-2:#F4EFE3; --edge:#E4DCC9;
  --rule:#DCE5EF; --margin-rule:#E9BCB0;
  --ink:#1B2A4A; --ink-soft:#5A6A88; --gold:#B8893F;
  --yellow:#FFE168; --mint:#A9DCC6; --sky:#BCDCF2; --coral:#F6C2AF; --lilac:#D8CFF0;
  --desk:#E7E2D7;
  --hand:'Caveat',cursive; --display:'Fredoka',sans-serif; --body:'Nunito',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);font-family:var(--body);color:var(--ink);
  background-image:radial-gradient(circle at 1px 1px,rgba(27,42,74,.05) 1px,transparent 0);background-size:22px 22px}

.wrap{max-width:1060px;margin:0 auto;padding:28px 16px 64px}

.brandbar{display:flex;align-items:center;gap:12px;margin:0 0 18px 4px}
.brandbar img{width:44px;height:44px;border-radius:50%;box-shadow:0 2px 6px rgba(27,42,74,.18);transform:rotate(-5deg)}
.brandbar b{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.01em}
.brandbar span{font-family:var(--hand);font-size:19px;color:var(--gold)}

.book{position:relative;perspective:1800px}
.book:after{content:"";position:absolute;inset:14px -6px -8px 20px;background:var(--paper-2);
  border-radius:6px 14px 14px 6px;box-shadow:0 10px 26px rgba(27,42,74,.16);z-index:0}
.book:before{content:"";position:absolute;inset:8px -3px -4px 20px;background:#F7F2E6;
  border-radius:6px 14px 14px 6px;z-index:0}

.sheet{position:relative;z-index:2;background:var(--paper);border-radius:6px 14px 14px 6px;
  min-height:640px;padding:26px 34px 54px 76px;box-shadow:0 4px 18px rgba(27,42,74,.14);
  background-image:repeating-linear-gradient(transparent,transparent 33px,var(--rule) 33px,var(--rule) 34px);
  background-position:0 78px;transform-origin:left center;backface-visibility:hidden}
.sheet:before{content:"";position:absolute;top:0;bottom:0;left:56px;width:1px;background:var(--margin-rule)}

.rings{position:absolute;z-index:4;top:34px;bottom:34px;left:18px;width:26px;
  display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.ring{width:26px;height:13px;border:2.5px solid #9AA3B2;border-radius:13px;background:transparent;
  box-shadow:inset 0 -2px 0 rgba(255,255,255,.7)}

.tabs{position:absolute;z-index:3;top:56px;right:-14px;display:flex;flex-direction:column;gap:9px}
.tab{position:relative;border:0;cursor:pointer;font-family:var(--display);font-weight:500;font-size:13.5px;
  color:var(--ink);padding:11px 16px 11px 20px;border-radius:0 10px 10px 0;text-align:left;min-width:132px;
  box-shadow:2px 2px 0 rgba(27,42,74,.12);transition:transform .16s ease,box-shadow .16s ease}
.tab:hover{transform:translateX(7px)}
.tab[aria-selected="true"]{transform:translateX(12px);box-shadow:3px 3px 0 rgba(27,42,74,.2)}
.tab small{display:block;font-family:var(--body);font-size:11px;font-weight:600;opacity:.62;margin-top:1px}
.t1{background:var(--yellow)} .t2{background:var(--mint)} .t3{background:var(--sky)}
.t4{background:var(--coral)} .t5{background:var(--lilac)}

.head{position:relative;margin:0 0 22px}
.eyebrow{font-family:var(--hand);font-size:21px;color:var(--gold);margin:0}
.head h1{font-family:var(--display);font-weight:600;font-size:29px;line-height:1.15;margin:2px 0 0;max-width:15ch}
.head p{font-size:14.5px;color:var(--ink-soft);margin:8px 0 0;max-width:60ch;line-height:1.6}
.logo-stamp{position:absolute;top:-6px;right:6px;width:56px;height:56px;border-radius:50%;
  transform:rotate(7deg);box-shadow:0 2px 8px rgba(27,42,74,.2);opacity:.95}
.mark{position:absolute;right:26px;bottom:22px;width:210px;opacity:.055;mix-blend-mode:multiply;pointer-events:none}

.tape{position:absolute;width:96px;height:26px;background:rgba(255,225,104,.62);
  box-shadow:0 1px 2px rgba(27,42,74,.12);transform:rotate(-4deg)}
.tape.b{background:rgba(169,220,198,.6)}

.turn-out{animation:turnOut .26s ease-in forwards}
.turn-in{animation:turnIn .3s ease-out backwards}
@keyframes turnOut{to{transform:rotateY(-88deg);opacity:.15}}
@keyframes turnIn{from{transform:rotateY(74deg);opacity:.2}to{transform:rotateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.turn-out,.turn-in{animation:none}}

h2.sec{font-family:var(--display);font-weight:500;font-size:19px;margin:26px 0 4px}
.note{font-family:var(--hand);font-size:19px;color:var(--ink-soft);margin:0 0 14px}
.hint{font-size:13px;color:var(--ink-soft);margin:0 0 16px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(212px,1fr))}

.card{position:relative;border-radius:3px;padding:15px 16px 17px;font-size:13.5px;line-height:1.55;
  box-shadow:2px 3px 0 rgba(27,42,74,.1);cursor:pointer;transition:transform .18s ease}
.card:hover{transform:translateY(-3px) rotate(-.6deg)}
.card h3{font-family:var(--display);font-weight:500;font-size:15px;margin:0 0 6px}
.card .num{font-family:var(--hand);font-size:22px;line-height:1;opacity:.5;position:absolute;top:8px;right:12px}
.c-y{background:#FFF0B8} .c-m{background:#D6F0E4} .c-s{background:#DCEDFA} .c-c{background:#FBDFD3} .c-l{background:#E9E3F8}
.card ul{margin:6px 0 0;padding-left:17px} .card li{margin:2px 0}
.card .more{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed rgba(27,42,74,.25)}
.card.open .more{display:block}
.card .peek{font-family:var(--hand);font-size:17px;color:var(--ink-soft);margin-top:8px}
.card.open .peek{display:none}

.fiche{position:relative;height:158px;perspective:900px;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
.fiche .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.7,.3,1);transform-style:preserve-3d}
.fiche.flip .in{transform:rotateY(180deg)}
.fiche .f,.fiche .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:3px;padding:14px 15px;
  box-shadow:2px 3px 0 rgba(27,42,74,.1);display:flex;flex-direction:column;justify-content:center}
.fiche .f{background:#FFF0B8}
.fiche .b{background:#FBF8F1;border:1px solid var(--edge);transform:rotateY(180deg);justify-content:flex-start;font-size:13px;line-height:1.5}
.fiche .term{font-family:var(--display);font-weight:500;font-size:20px}
.fiche .pos{font-size:12px;color:var(--ink-soft);margin-top:3px}
.fiche .uk{color:var(--gold);font-weight:700;margin-bottom:5px}
.fiche .ex{font-style:italic;color:var(--ink-soft);margin-top:6px}

.idx{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 20px}
.idx button{border:0;cursor:pointer;font-family:var(--body);font-weight:700;font-size:12.5px;color:var(--ink);
  background:var(--paper-2);padding:8px 13px;border-radius:9px 9px 3px 3px;box-shadow:0 2px 0 rgba(27,42,74,.12);
  transition:transform .14s ease}
.idx button[aria-selected="true"]{background:var(--yellow);transform:translateY(-3px)}
.idx button:hover{transform:translateY(-3px)}

.q{display:flex;gap:11px;align-items:baseline;margin:0 0 15px;font-size:15px;line-height:1.9}
.q .n{font-family:var(--hand);font-size:20px;color:var(--gold);min-width:20px}
input.blank{font:inherit;font-weight:700;color:var(--ink);border:0;border-bottom:2px solid var(--ink-soft);
  background:rgba(255,255,255,.55);width:9.5em;padding:1px 5px;text-align:center;border-radius:3px 3px 0 0}
input.blank:focus{outline:none;border-bottom-color:var(--gold);background:#FFF8DE}
input.blank.ok{border-bottom-color:#2E8B62;background:#E4F5EC}
input.blank.no{border-bottom-color:#C0503C;background:#FBE7E2}

.btn{font-family:var(--display);font-weight:500;font-size:14px;border:0;cursor:pointer;color:var(--ink);
  background:var(--mint);padding:10px 20px;border-radius:22px;box-shadow:0 3px 0 rgba(27,42,74,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(27,42,74,.18)}
.btn.ghost{background:var(--paper-2)}
.row{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.score{font-family:var(--hand);font-size:22px;color:var(--gold)}

.stamp{display:none;font-family:var(--display);font-weight:600;font-size:15px;color:#2E8B62;
  border:2.5px solid #2E8B62;border-radius:7px;padding:4px 12px;transform:rotate(-7deg);opacity:.9}
.stamp.on{display:inline-block;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:rotate(-7deg) scale(.4);opacity:0}}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 54px;position:relative}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.chip{border:0;cursor:pointer;font:inherit;font-size:14px;font-weight:600;color:var(--ink);text-align:left;
  background:#FFF;border:1px solid var(--edge);padding:10px 13px;border-radius:4px;
  box-shadow:1px 2px 0 rgba(27,42,74,.1);position:relative;z-index:1;transition:transform .14s ease}
.chip:hover{transform:translateX(3px)}
.chip.sel{background:var(--yellow);box-shadow:0 0 0 2px var(--gold)}
.chip.done{background:#E4F5EC;color:#2E6B50;cursor:default;box-shadow:none}
.shake{animation:sh .32s}
@keyframes sh{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

.bank{display:flex;flex-wrap:wrap;gap:9px;padding:13px;background:var(--paper-2);border-radius:5px;
  border:1px dashed var(--edge);margin-bottom:20px}
.word{cursor:grab;font-weight:700;font-size:14px;background:#FFF0B8;padding:8px 13px;border-radius:4px;
  box-shadow:1px 2px 0 rgba(27,42,74,.12);user-select:none}
.word.used{opacity:.28;pointer-events:none}
.slot{display:inline-block;min-width:10.5em;border-bottom:2px dashed var(--ink-soft);text-align:center;
  padding:2px 7px;font-weight:700;vertical-align:baseline}
.slot.over{background:#FFF8DE;border-bottom-color:var(--gold)}
.slot.filled{border-bottom-style:solid;border-bottom-color:#2E8B62;background:#E4F5EC;border-radius:3px 3px 0 0}

.pick{display:inline-flex;gap:6px;margin:0 4px}
.pick button{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:13.5px;background:#FFF;
  border:1px solid var(--edge);padding:5px 12px;border-radius:16px}
.pick button.ok{background:#D6F0E4;border-color:#2E8B62}
.pick button.no{background:#FBE7E2;border-color:#C0503C}
.why{font-family:var(--hand);font-size:18px;color:var(--ink-soft);margin:2px 0 0 31px;display:none}
.why.on{display:block}

.taskcard{position:relative;height:210px;perspective:1000px;cursor:pointer;background:none;border:0;padding:0;text-align:left;font:inherit}
.taskcard .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.3,1);transform-style:preserve-3d}
.taskcard.flip .in{transform:rotateY(180deg)}
.taskcard .f,.taskcard .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:3px;padding:16px;
  box-shadow:2px 3px 0 rgba(27,42,74,.1)}
.taskcard .f{background:#FBDFD3;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.taskcard .f h3{font-family:var(--display);font-weight:500;font-size:19px;margin:0}
.taskcard .b{background:#FBF8F1;border:1px solid var(--edge);transform:rotateY(180deg);font-size:12.8px;line-height:1.5;overflow:auto}
.taskcard .b ul{padding-left:16px;margin:8px 0 0}

.hw{list-style:none;padding:0;margin:0}
.hw li{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--edge);font-size:14.5px}
.hw input{width:19px;height:19px;accent-color:#2E8B62;margin-top:2px;flex:none}
.hw a{color:var(--gold);font-weight:700}

@media(max-width:820px){
  .sheet{padding:22px 20px 46px 54px}
  .rings{left:12px;width:20px}.ring{width:20px}
  .tabs{position:static;flex-direction:row;flex-wrap:wrap;margin-bottom:14px;gap:7px}
  .tab{border-radius:10px 10px 3px 3px;min-width:0;padding:9px 13px}
  .tab:hover,.tab[aria-selected="true"]{transform:translateY(-3px)}
  .match{grid-template-columns:1fr;gap:9px}.match svg{display:none}
  .logo-stamp{width:44px;height:44px}
}
</style>

<div class="wrap">
  <div class="brandbar">
    <img src="" data-logo alt="Werba Way">
    <div><b>Werba Way</b><br><span>polski B1 · lekcja 1</span></div>
  </div>

  <div class="book">
    <div class="rings" aria-hidden="true"></div>
    <nav class="tabs" role="tablist" aria-label="Sekcje lekcji"></nav>
    <div class="sheet" id="sheet">
      <img class="mark" src="" data-logo alt="" aria-hidden="true">
      <img class="logo-stamp" src="" data-logo alt="Werba Way">
      <div class="head" id="head"></div>
      <div id="body"></div>
    </div>
  </div>
</div>

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ").replace(/[.,!?]/g,"");
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

const rings=$(".rings");
for(let i=0;i<13;i++){const d=document.createElement("div");d.className="ring";rings.appendChild(d)}

const tabs=$(".tabs");
PAGES.forEach((p,i)=>{
  const b=document.createElement("button");
  b.className="tab "+p.cls;b.type="button";b.setAttribute("role","tab");
  b.setAttribute("aria-selected",i===0?"true":"false");
  b.innerHTML=p.label+"<small>"+p.sub+"</small>";
  b.onclick=()=>go(i);
  tabs.appendChild(b);
});

let cur=0;
function go(i){
  if(i===cur)return;
  const sheet=$("#sheet");
  [...tabs.children].forEach((t,k)=>t.setAttribute("aria-selected",k===i?"true":"false"));
  sheet.classList.remove("turn-in");sheet.classList.add("turn-out");
  setTimeout(()=>{
    cur=i;render();
    sheet.classList.remove("turn-out");sheet.classList.add("turn-in");
    window.scrollTo({top:0,behavior:"smooth"});
  },250);
}

function render(){
  const p=PAGES[cur];
  $("#head").innerHTML='<p class="eyebrow">'+p.eyebrow+'</p><h1>'+p.title+'</h1><p>'+p.lead+'</p>';
  const b=$("#body");b.innerHTML="";
  ({slownik:pgVocab,tablica:pgBoard,cwiczenia:pgEx,zadania:pgTasks,dom:pgHw}[p.id])(b);
}

function pgVocab(root){
  const g=document.createElement("div");g.className="grid";
  VOCAB.forEach(v=>{
    const el=document.createElement("button");el.className="fiche";el.type="button";
    el.innerHTML='<div class="in"><div class="f"><div class="term">'+esc(v[0])+'</div><div class="pos">'+esc(v[1])+
      '</div></div><div class="b"><div class="uk">'+esc(v[2])+'</div>'+esc(v[3])+'<div class="ex">'+esc(v[4])+'</div></div></div>';
    el.onclick=()=>el.classList.toggle("flip");
    g.appendChild(el);
  });
  root.append(mkNote("kliknij, żeby odwrócić →"),g);
}

function pgBoard(root){
  const g=document.createElement("div");g.className="grid";
  BOARD.forEach((c,i)=>{
    const el=document.createElement("div");el.className="card "+c[0];el.tabIndex=0;
    el.innerHTML='<span class="num">'+(i+1)+'</span><h3>'+esc(c[1])+'</h3>'+esc(c[2])+
      '<div class="peek">rozwiń ↓</div><div class="more">'+esc(c[3])+'</div>';
    const t=()=>el.classList.toggle("open");
    el.onclick=t;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t()}};
    g.appendChild(el);
  });
  root.appendChild(g);
}

function mkNote(t){const p=document.createElement("p");p.className="note";p.textContent=t;return p}

function pgEx(root){
  const idx=document.createElement("div");idx.className="idx";
  const host=document.createElement("div");
  const blocks=[["1 · Rozgrzewka",exFill],["2 · Imiesłowy",exMatch],["3 · Przekształcenia",exDrag],["4 · Był czy został",exPick]];
  blocks.forEach((bl,i)=>{
    const b=document.createElement("button");b.type="button";b.textContent=bl[0];
    b.setAttribute("aria-selected",i===0?"true":"false");
    b.onclick=()=>{[...idx.children].forEach((x,k)=>x.setAttribute("aria-selected",k===i?"true":"false"));
      host.innerHTML="";bl[1](host)};
    idx.appendChild(b);
  });
  root.append(idx,host);blocks[0][1](host);
}

function exFill(root){
  root.append(mkNote("wpisz: jest, są, był, była, było, były, został, została, zostało, zostały"));
  FILLS.forEach((f,i)=>{
    const d=document.createElement("div");d.className="q";
    d.innerHTML='<span class="n">'+(i+1)+'</span><span>'+esc(f[0]).replace("___",
      '<input class="blank" data-a="'+f[1]+'" aria-label="luka '+(i+1)+'">')+'</span>';
    root.appendChild(d);
  });
  const row=document.createElement("div");row.className="row";
  row.innerHTML='<button class="btn" type="button">Sprawdź</button><span class="stamp">Dobra robota!</span><span class="score"></span>';
  row.firstChild.onclick=()=>{
    let ok=0;const ins=[...root.querySelectorAll(".blank")];
    ins.forEach(x=>{const good=norm(x.value)===norm(x.dataset.a);
      x.classList.toggle("ok",good);x.classList.toggle("no",!good&&x.value!=="");if(good)ok++});
    row.querySelector(".score").textContent=ok+" / "+ins.length;
    row.querySelector(".stamp").classList.toggle("on",ok===ins.length);
  };
  root.appendChild(row);
}

function exMatch(root){
  root.append(mkNote("kliknij czasownik, potem jego imiesłów"));
  const wrap=document.createElement("div");wrap.className="match";
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");wrap.appendChild(svg);
  const L=PAIRS.map(p=>p[0]),R=shuffle(PAIRS.map(p=>p[1]));
  const cols=[document.createElement("div"),document.createElement("div")];
  cols.forEach(c=>{c.style.display="grid";c.style.gap="10px"});
  L.forEach(t=>cols[0].appendChild(mkChip(t,"L")));
  R.forEach(t=>cols[1].appendChild(mkChip(t,"R")));
  wrap.append(cols[0],cols[1]);root.appendChild(wrap);
  const done=document.createElement("p");done.className="score";done.style.marginTop="16px";root.appendChild(done);
  let sel=null,n=0;
  function mkChip(t,side){const b=document.createElement("button");b.type="button";b.className="chip";
    b.textContent=t;b.dataset.side=side;b.onclick=()=>pick(b);return b}
  function pick(b){
    if(b.classList.contains("done"))return;
    if(b.dataset.side==="L"){root.querySelectorAll(".chip.sel").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel");sel=b;return}
    if(!sel)return;
    const good=PAIRS.some(p=>p[0]===sel.textContent&&p[1]===b.textContent);
    if(!good){b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),340);return}
    sel.classList.remove("sel");sel.classList.add("done");b.classList.add("done");
    line(sel,b);sel=null;n++;
    if(n===PAIRS.length)done.textContent="Wszystkie sześć par gotowe.";
  }
  function line(a,b){
    const r=wrap.getBoundingClientRect(),ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
    const el=document.createElementNS("http://www.w3.org/2000/svg","path");
    const x1=ra.right-r.left,y1=ra.top-r.top+ra.height/2,x2=rb.left-r.left,y2=rb.top-r.top+rb.height/2;
    el.setAttribute("d","M"+x1+" "+y1+"C"+(x1+34)+" "+y1+","+(x2-34)+" "+y2+","+x2+" "+y2);
    el.setAttribute("fill","none");el.setAttribute("stroke","#2E8B62");el.setAttribute("stroke-width","2");
    el.setAttribute("stroke-linecap","round");svg.appendChild(el);
  }
}

function exDrag(root){
  root.append(mkNote("przeciągnij imiesłów w lukę (albo kliknij słowo, potem lukę)"));
  const bank=document.createElement("div");bank.className="bank";
  shuffle(DRAGS.map(d=>d[1]).concat(DRAG_EXTRA)).forEach(w=>{
    const s=document.createElement("span");s.className="word";s.draggable=true;s.textContent=w;
    s.ondragstart=e=>e.dataTransfer.setData("text",w);
    s.onclick=()=>{held=held===s?null:s;bank.querySelectorAll(".word").forEach(x=>x.style.outline="");
      if(held)s.style.outline="2px solid var(--gold)"};
    bank.appendChild(s);
  });
  root.appendChild(bank);
  let held=null,n=0;
  const done=document.createElement("p");done.className="score";done.style.marginTop="16px";
  DRAGS.forEach((d,i)=>{
    const q=document.createElement("div");q.className="q";
    q.innerHTML='<span class="n">'+(i+1)+'</span><span>'+esc(d[0]).replace("___",
      '<span class="slot" data-a="'+d[1]+'">&nbsp;</span>')+'</span>';
    const slot=q.querySelector(".slot");
    slot.ondragover=e=>{e.preventDefault();slot.classList.add("over")};
    slot.ondragleave=()=>slot.classList.remove("over");
    slot.ondrop=e=>{e.preventDefault();slot.classList.remove("over");drop(slot,e.dataTransfer.getData("text"))};
    slot.onclick=()=>{if(held)drop(slot,held.textContent)};
    root.appendChild(q);
  });
  root.appendChild(done);
  function drop(slot,w){
    if(slot.classList.contains("filled"))return;
    if(w!==slot.dataset.a){slot.classList.add("shake");setTimeout(()=>slot.classList.remove("shake"),340);return}
    slot.textContent=w;slot.classList.add("filled");
    [...bank.querySelectorAll(".word")].filter(x=>x.textContent===w&&!x.classList.contains("used"))[0].classList.add("used");
    held=null;bank.querySelectorAll(".word").forEach(x=>x.style.outline="");
    if(++n===DRAGS.length)done.textContent="Cztery na cztery. Zostały dwa słowa, które nigdzie nie pasują.";
  }
}

function exPick(root){
  root.append(mkNote("proces czy zakończony fakt?"));
  PICKS.forEach((p,i)=>{
    const q=document.createElement("div");q.className="q";
    const pick='<span class="pick"><button type="button" data-i="0">'+p[1][0]+
      '</button><button type="button" data-i="1">'+p[1][1]+'</button></span>';
    q.innerHTML='<span class="n">'+(i+1)+'</span><span>'+esc(p[0]).replace("___",pick)+'</span>';
    const why=document.createElement("p");why.className="why";why.textContent="↳ "+p[3];
    q.querySelectorAll(".pick button").forEach(b=>b.onclick=()=>{
      const good=+b.dataset.i===p[2];
      b.classList.add(good?"ok":"no");
      if(good){q.querySelectorAll(".pick button").forEach(x=>x.disabled=true);why.classList.add("on")}
    });
    root.append(q,why);
  });
}

function pgTasks(root){
  const g=document.createElement("div");g.className="grid";
  TASKS.forEach(t=>{
    const el=document.createElement("button");el.className="taskcard";el.type="button";
    el.innerHTML='<div class="in"><div class="f"><h3>'+esc(t[0])+'</h3></div><div class="b"><b>'+
      esc(t[1])+'</b><ul>'+t[2].map(x=>"<li>"+esc(x)+"</li>").join("")+'</ul></div></div>';
    el.onclick=()=>el.classList.toggle("flip");
    g.appendChild(el);
  });
  root.append(mkNote("odwróć kartę →"),g);
}

function pgHw(root){
  const items=["Słowniczek: 38 słów, powtórz grupami","Gramatyka: 10 zdań na pełną formę strony biernej",
   "Przekształcenia: 6 zdań ze stroną czynną","Wideo: 10 wynalazków, które zmieniły życie ludzi",
   "Czytanie: Historia internetu w punktach — wypisz pięć dat","Pisanie: wpis na bloga, 120–150 słów"];
  const ul=document.createElement("ul");ul.className="hw";
  items.forEach((t,i)=>{
    const li=document.createElement("li");
    li.innerHTML='<input type="checkbox" id="h'+i+'"><label for="h'+i+'">'+esc(t)+'</label>';
    ul.appendChild(li);
  });
  const p=document.createElement("p");p.className="note";p.style.marginTop="20px";
  p.innerHTML='temat wypracowania: <b>Wynalazek, bez którego nie wyobrażam sobie życia</b>';
  root.append(ul,p);
}

document.querySelectorAll('img[src="" data-logo]').forEach(i=>i.src=LOGO);
render();
</script>
